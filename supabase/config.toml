# JWT verification policy
# Default for all functions: verify_jwt = true (safe).
# Functions listed below deviate from the default with an explicit justification.

# Public webhook endpoints — no JWT because external providers (Creatomate, Klap)
# cannot present a Supabase JWT.  Each endpoint authenticates the caller via a
# pre-shared secret token embedded in the callback URL registered with the provider.
# See B-02 in RICKY_PHASE_0_AUDIT.md for the full verification implementation.
[functions.video-callback]
verify_jwt = false

[functions.clip-callback]
verify_jwt = false

# reconcile-renders is called by pg_cron/pg_net from inside Postgres —
# no user JWT available.  It authenticates via RECONCILE_SECRET query param.
[functions.reconcile-renders]
verify_jwt = false

# save-api-key requires a valid user JWT — browser must be signed in.
# verify_jwt = true is the default and does not need to be listed, but it is
# included here for explicit documentation of the write path for B-01.
[functions.save-api-key]
verify_jwt = true

# handle-call is a Twilio webhook — Twilio cannot present a Supabase JWT.
# Signature validation is performed inside the function using TWILIO_AUTH_TOKEN.
[functions.handle-call]
verify_jwt = false

# handle-call-gather is the <Gather> callback for the AI voice conversation loop.
# Same authentication model as handle-call: Twilio HMAC-SHA1 via TWILIO_AUTH_TOKEN.
[functions.handle-call-gather]
verify_jwt = false

# run-automations is called by pg_cron — no user JWT available.
# Authenticates via RECONCILE_SECRET query param.
[functions.run-automations]
verify_jwt = false

# send-appointment-reminders is called by pg_cron — no user JWT available.
# Authenticates via RECONCILE_SECRET query param.
[functions.send-appointment-reminders]
verify_jwt = false

# aggregate-genome is called by pg_cron — no user JWT available.
# Authenticates via RECONCILE_SECRET query param.
[functions.aggregate-genome]
verify_jwt = false

# landing-page serves public HTML pages for offers/campaigns.
# No JWT — visitors arrive from external links with no Supabase session.
[functions.landing-page]
verify_jwt = false
